name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Package DMG
        run: ./scripts/create-dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: StealthTicker-dmg
          path: dist/*.dmg
          if-no-files-found: error
